<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>
  <link rel="stylesheet" href="./style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="card-container">
    <div class="card">
      <img src="./images/illustration-hero.svg" alt="" class="card-image">
      <h1 class="card-title">Order Summary</h1>
      <p class="card-desc">
              You can now listen to millions of songs, audiobooks, and podcasts on any 
        device anywhere you like!
      </p>

      <div class="product-section">
        <img src="./images/icon-music.svg" alt="">
          <div class="product-info">
            <div class="product-name">Annual Plan</div> 
            <div class="product-price">$59.99/year</div>
          </div>
          <div class="change-product"><a href="#">Change</a></div>
        </div>

      <div class="buttons">
        <button class="precces-button">Proceed to Payment</button>
        <button class="cancel-button">Cancel Order</button>
      </div>

      <footer>
          Made with ☕ & ❤️ by
          <a href="https://github.com/Hekson" target="_blank">
              Amir Hekson
          </a>
      </footer>
    </div>
  </div>
  

</body>
</html>
